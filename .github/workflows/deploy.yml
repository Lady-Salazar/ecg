name: Deploy CardioLab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html app.js learning-experience.js ecgenius-features.js classifier-engine.js ecg-model.js styles.css enhancements.css learning.css ecgenius-replica.css manifest.webmanifest icon.svg sw.js dist/
          cp -R assets dist/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
